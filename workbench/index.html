<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SuitMe 协作台</title>
  <link rel="stylesheet" href="/workbench.css">
  <script defer src="/vue.js"></script>
  <script defer src="/app.js"></script>
</head>
<body>
  <main id="app" v-cloak>
    <div v-if="!workspace" class="login-layout">
      <form class="login-card" @submit.prevent="login">
        <div class="brand"><span class="mark">S</span> SuitMe</div>
        <h1>登录协作台</h1>
        <label>账号<input v-model.trim="credentials.username" name="username" autocomplete="username" required></label>
        <label>口令<input v-model="credentials.password" name="password" type="password" autocomplete="current-password" required></label>
        <p v-if="error" class="error" role="alert">{{ error }}</p>
        <button class="primary" type="submit" :disabled="busy">登录</button>
      </form>
    </div>
    <div v-else class="layout">
      <aside class="sidebar">
        <div class="brand"><span class="mark">S</span> SuitMe 协作台</div>
        <nav aria-label="工作台">
          <button v-for="tab in tabs" :key="tab.id" :aria-current="view===tab.id ? 'page' : null" @click="go(tab.id)" :class="{current: view===tab.id}">{{ tab.title }}<span v-if="tab.id==='inbox' && (attention.length || discussionReviews.length)" class="counter">{{ attention.length + discussionReviews.length }}</span></button>
        </nav>
        <div class="projects">
          <p>项目</p>
          <button v-for="p in workspace.projects" :key="p.id" :aria-pressed="projectId===p.id" :class="{child:p.parent,current:projectId===p.id}" @click="selectProject(p.id)">{{ p.title }}</button>
        </div>
        <div class="profile"><span>{{ workspace.actor }}</span><button v-if="workspace.crossChannel" class="quiet" :aria-current="view==='accounts' ? 'page' : null" @click="go('accounts')">渠道账号</button><button class="quiet" @click="logout">退出</button></div>
      </aside>
      <section class="screen">
        <header class="page-header">
          <div><div class="context"><template v-if="parentProject"><button class="link" @click="selectProject(parentProject.id)">{{ parentProject.title }}</button> / </template>{{ project?.title || '团队工作台' }}</div><h1>{{ pageTitle }}</h1></div>
          <button v-if="project?.mayStart && view!=='create'" class="primary" @click="openComposer()">发起协作</button>
        </header>
        <p v-if="error" class="error" role="alert">{{ error }}</p>
        <p v-if="notice" class="notice" role="status">{{ notice }}</p>
        <template v-if="view==='inbox'">
          <section class="panel">
            <h2>待我处理</h2>
            <p v-if="!attention.length && !channels.pending.length && !discussionReviews.length" class="muted">当前没有待你决定的事项。</p>
            <div v-for="p in discussionReviews" :key="p.id" class="row">
              <button class="link" @click="goToDiscussion(p.id)">{{ p.title }} · 群反馈待判断</button>
              <span class="status">{{ p.discussion.pending }} 条</span>
            </div>
            <div v-for="item in attention" :key="item.id" class="row">
              <button class="link" @click="openTicket(item.id)">{{ item.title }}</button>
              <span class="status">{{ stateOf(item) }}</span>
            </div>
          </section>
          <section v-if="channels.pending.length" class="panel">
            <h2>待确认工单归属</h2>
            <article v-for="item in channels.pending" :key="item.id" class="document">
              <small>{{ workspace.projects.find(p=>p.id===item.project)?.title }} · {{ sourceName(item.source) }} · {{ item.member }}</small>
              <p class="prose">{{ item.request }}</p>
              <p class="muted">{{ item.reason }}</p>
              <a v-if="item.url" :href="item.url" target="_blank" rel="noopener noreferrer">查看来源</a>
              <div class="form inner">
                <label>已有工单<select v-model="channelTargets[item.id]">
                  <option value="" disabled>请选择工单</option>
                  <option v-for="work in workspace.tickets.filter(t=>t.work.project===item.project)" :key="work.id" :value="work.id">{{ work.title }}</option>
                </select></label>
                <label v-if="workspace.projects.find(p=>p.id===item.project)?.topics.length">新工单主题
                  <select :value="channelTopics[item.id] || item.topic || ''" @change="channelTopics[item.id]=$event.target.value"><option value="">使用来源默认主题</option>
                    <option v-for="topic in workspace.projects.find(p=>p.id===item.project).topics" :key="topic.id" :value="topic.id">{{ topicLabel(topic,workspace.projects.find(p=>p.id===item.project).topics) }}</option>
                  </select>
                </label>
                <div class="actions">
                  <button class="primary" :disabled="busy || !channelTargets[item.id]" @click="resolveChannel(item,'link')">关联工单</button>
                  <button :disabled="busy" @click="resolveChannel(item,'create')">确认新建</button>
                  <button class="quiet" :disabled="busy" @click="resolveChannel(item,'dismiss')">忽略</button>
                </div>
              </div>
            </article>
          </section>
          <section class="panel" id="project-work">
            <div v-if="selectedTopic" class="section-head"><h2>{{ topicLabel(selectedTopic) }}</h2><button class="quiet" @click="focusedTopic=''">查看全部工单</button></div>
            <h2 v-else>{{ project?.title ? '项目工单' : '工单' }}</h2>
            <p v-if="!topicGroups.some(group=>group.tickets.length)" class="muted">暂无工单。</p>
            <template v-for="topic in topicGroups" :key="topic.id">
              <h3 v-if="topic.tickets.length && ((!selectedTopic && project?.topics.length) || (selectedTopic && topic.parent===selectedTopic.id))" class="work-topic">{{ selectedTopic ? topic.title : topicLabel(topic) }}</h3>
              <div v-for="item in topic.tickets" :key="item.id" class="row">
                <button class="link" @click="openTicket(item.id)">{{ item.title }}</button>
                <span class="muted">{{ agentName(item.work.agent) }}</span>
                <span class="status">{{ stateOf(item) }}</span>
              </div>
            </template>
          </section>
          <section v-if="topicDiscussion.length" class="panel"><h2>主题反馈</h2>
            <article v-for="item in topicDiscussion" :key="item.id" class="document">
              <strong>{{ item.title }}</strong><p class="prose">{{ item.reason }}</p>
              <a v-for="(source,index) in item.evidence.filter(source=>source.url)" :key="index" :href="source.url" target="_blank" rel="noopener noreferrer" class="source-link">{{ source.title }}</a>
            </article>
          </section>
        </template>
        <template v-if="view==='accounts' && workspace.crossChannel">
          <section class="panel">
            <h2>账号绑定</h2>
            <div v-for="provider in ['feishu','github']" :key="provider" class="document">
              <div class="row"><strong>{{ sourceName(provider) }}</strong><button :disabled="busy" @click="beginChannel(provider)">绑定账号</button></div>
              <div v-for="account in channels.accounts.filter(a=>a.provider===provider)" :key="account.namespace+':'+account.id" class="row">
                <span>{{ account.label }}</span><button class="quiet" :disabled="busy" @click="unlinkChannel(account)">解除绑定</button>
              </div>
              <template v-for="proof in channels.proofs.filter(p=>p.provider===provider)" :key="proof.provider">
                <div v-if="proof.sender" class="row">
                  <span>已收到 {{ proof.sender.label }} 的验证</span>
                  <a v-if="proof.url" :href="proof.url" target="_blank" rel="noopener noreferrer">查看验证消息</a>
                  <button :disabled="busy" @click="confirmChannel(proof)">确认绑定</button>
                </div>
                <template v-else-if="proofCommands[provider]">
                  <p>{{ provider==='feishu' ? '将命令发给飞书机器人单聊。' : '将命令评论在项目已接入仓库的 Issue 中。' }}</p>
                  <code>{{ proofCommands[provider] }}</code>
                </template>
              </template>
            </div>
          </section>
        </template>
        <template v-if="view==='project' && project">
          <section v-if="subprojects.length || project.topics.length || project.maintain" class="panel">
            <div class="section-head"><h2>项目结构</h2><button v-if="project.maintain" @click="topicOpen=!topicOpen">{{ topicOpen ? '收起' : '新建主题' }}</button></div>
            <form v-if="topicOpen && project.maintain" class="form inner" @submit.prevent="addTopic">
              <label>主题名称<input v-model.trim="newTopic" maxlength="100" required></label>
              <label v-if="topTopics.length">上级主题（选填）<select v-model="newTopicParent"><option value="">当前项目</option><option v-for="topic in topTopics" :key="topic.id" :value="topic.id">{{ topic.title }}</option></select></label>
              <button :disabled="busy" class="primary">保存主题</button>
            </form>
            <div v-for="child in subprojects" :key="child.id" class="row"><button class="link" @click="selectProject(child.id)">{{ child.title }}</button><span class="muted">子项目</span></div>
            <div v-for="topic in topicOptions" :key="topic.id" class="row" :class="{'topic-child':topic.parent}"><button class="link" @click="showTopic(topic.id)">{{ topic.title }}</button><span class="muted">{{ topicCount(topic.id) }} 张工单</span></div>
          </section>
          <section v-if="discussion" id="project-discussion" class="panel">
            <div class="section-head"><h2>群消息整理</h2><span v-if="discussion.next" class="muted">下次 {{ discussionWhen(discussion.next) }}</span></div>
            <p class="muted">{{ discussion.schedule }}<template v-if="discussion.waiting"> · 已收到 {{ discussion.waiting }} 条待整理</template><template v-if="discussion.last"> · {{ discussionStates[discussion.last.state] }}</template></p>
            <p v-if="discussion.last?.state==='done'" class="muted">上次整理 {{ discussionWhen(discussion.last.slot) }}</p>
            <p v-if="discussion.last?.detail && project.maintain" class="muted">{{ discussion.last.detail }}</p>
            <article v-for="item in discussion.items" :key="item.id" class="document">
              <div class="section-head"><strong>{{ item.title }}</strong>
                <span class="status">{{ item.status==='pending' ? '待负责人判断' : item.status==='suggested' ? '建议开单' : discussionLabels[item.destination.action] }}</span>
              </div>
              <p class="prose">{{ item.reason }}</p>
              <div class="actions">
                <button v-if="item.ticket" class="link" @click="openTicket(item.ticket)">查看工单</button>
                <details v-if="item.evidence.length"><summary>查看依据</summary>
                  <div v-for="(source,index) in item.evidence" :key="index" class="row source-row">
                    <a v-if="source.url" :href="source.url" target="_blank" rel="noopener noreferrer">{{ source.title }}</a><span v-else>{{ source.title }}</span>
                    <small v-if="source.revision">{{ source.revision }}</small>
                  </div>
                </details>
                <button v-if="item.status!=='applied' && !discussionDrafts[item.id]" @click="editDiscussion(item)">处理</button>
              </div>
              <form v-if="discussionDrafts[item.id] && item.status!=='applied'" class="form inner" @submit.prevent="resolveDiscussion(item)">
                <label>怎么处理<select v-model="discussionDrafts[item.id].action" required>
                  <option value="" disabled>选择去向</option><option value="project">记到项目</option><option v-if="topicOptions.length" value="topic">记到主题</option>
                  <option v-if="projectTickets.length" value="link">接续已有工单</option><option value="create">发起新工单</option><option value="dismiss">忽略</option>
                </select></label>
                <label v-if="discussionDrafts[item.id].action==='link'">工单<select v-model="discussionDrafts[item.id].ticket" required>
                  <option value="" disabled>选择工单</option><option v-for="candidate in projectTickets" :key="candidate.id" :value="candidate.id">{{ candidate.title }}</option>
                </select></label>
                <label v-if="['topic','create'].includes(discussionDrafts[item.id].action) && topicOptions.length">主题<select v-model="discussionDrafts[item.id].topic" :required="discussionDrafts[item.id].action==='topic'">
                  <option value="">当前项目</option><option v-for="candidate in topicOptions" :key="candidate.id" :value="candidate.id">{{ topicLabel(candidate) }}</option>
                </select></label>
                <label v-if="discussionDrafts[item.id].action==='create'">交给<select v-model="discussionDrafts[item.id].agent" required>
                  <option value="" disabled>选择在岗 Agent</option><option v-for="agent in projectAgents.filter(agent=>agent.active)" :key="agent.id" :value="agent.id">{{ agent.title }}</option>
                </select></label>
                <div class="actions"><button class="primary" :disabled="busy">确认</button><button type="button" @click="delete discussionDrafts[item.id]">取消</button></div>
              </form>
            </article>
          </section>
          <section class="panel">
            <div class="section-head"><h2>项目来源</h2><button v-if="project.maintain" @click="referenceOpen=!referenceOpen">{{ referenceOpen ? '收起' : '关联资料' }}</button></div>
            <form v-if="referenceOpen && project.maintain" class="form inner" @submit.prevent="addReference">
              <div class="two">
                <label>来源<select v-model="newReference.source"><option value="feishu-doc">飞书文档</option><option value="figma">Figma</option><option value="document">其他文档</option></select></label>
                <label>名称<input v-model.trim="newReference.label" maxlength="100" required></label>
              </div>
              <label>资料链接<input type="url" v-model.trim="newReference.url" required></label>
              <label>版本（选填）<input v-model.trim="newReference.revision" maxlength="120"></label>
              <button :disabled="busy" class="primary">保存资料</button>
            </form>
            <div v-for="ref in project.resources" :key="ref.ref" class="row source-row">
              <span class="muted">{{ sourceName(ref.source) }}</span>
              <a v-if="ref.url" :href="ref.url" target="_blank" rel="noopener noreferrer">{{ ref.label }}</a><span v-else>{{ ref.label }}</span>
              <span v-if="ref.revision" class="muted">版本 {{ ref.revision }}</span>
              <span class="status">{{ ref.state==='bound' ? resourcePurposes[ref.purpose] : '待确认' }}</span>
              <button v-if="ref.state==='observe' && project.maintain" :disabled="busy" @click="bindResource(ref)">确认归属</button>
            </div>
            <p v-if="!project.resources.length" class="muted">尚未关联外部资料。</p>
          </section>
          <section class="panel"><h2>项目成员</h2>
            <div v-for="person in project.members" :key="person.name" class="row">
              <strong>{{ person.name }}</strong><span v-if="person.responsibilities.length">{{ person.responsibilities.map(functionName).join('、') }}</span>
              <span v-if="person.maintain" class="status">项目维护人</span>
            </div>
          </section>
          <section class="panel"><h2>执行用量</h2><dl class="facts">
            <dt>输入 Token</dt><dd>{{ project.usage.input }}</dd>
            <dt>输出 Token</dt><dd>{{ project.usage.output }}</dd>
            <dt>已回传费用</dt><dd>{{ project.usage.reported ? project.usage.cost : '执行端未回传' }}</dd>
            <template v-if="project.budget"><dt>项目额度</dt><dd>{{ project.budget }}</dd></template>
          </dl></section>
        </template>
        <template v-if="view==='team'">
          <section v-for="group in groups" :key="group.id" class="panel">
            <h2>{{ group.title }}</h2>
            <div v-for="agent in group.agents" :key="agent.id" class="agent">
              <div class="avatar" aria-hidden="true">{{ agent.title[0] }}</div>
              <div><h3>{{ agent.title }}</h3><p>{{ agent.capability }}</p><small>{{ agent.owner }} · {{ agent.kind==='personal' ? '个人 Agent' : '专项 Agent' }} · {{ agent.engine }}</small></div>
              <div class="agent-actions">
                <button v-if="project?.mayStart && agent.active" @click="openComposer(agent.id)">委托</button><span v-else class="muted">{{ agent.active ? '在岗' : '已停用' }}</span>
                <button v-if="agent.canManage" class="quiet" @click="setAgent(agent)">{{ agent.active ? '停用' : '上岗' }}</button>
              </div>
            </div>
          </section>
          <p v-if="!groups.length" class="muted">当前项目没有登记的 Agent。</p>
        </template>
        <template v-if="view==='create'">
          <form class="panel form" @submit.prevent="submitTask">
            <label>协作标题<input v-model.trim="draft.title" maxlength="100" required></label>
            <label v-if="topicOptions.length">主题<select v-model="draft.topic"><option value="">未归入主题</option><option v-for="topic in topicOptions" :key="topic.id" :value="topic.id">{{ topicLabel(topic) }}</option></select></label>
            <label>你想完成什么<textarea v-model.trim="draft.request" rows="5" maxlength="3500" required></textarea></label>
            <label>交给<select v-model="draft.target" required><option value="" disabled>选择个人 Agent 或职能</option>
              <optgroup label="在岗 Agent"><option v-for="agent in projectAgents.filter(a=>a.active)" :key="agent.id" :value="'agent:'+agent.id">{{ agent.title }}</option></optgroup>
              <optgroup v-if="availableFunctions.length" label="职能"><option v-for="fn in availableFunctions" :key="fn.id" :value="'function:'+fn.id">{{ fn.title }}</option></optgroup>
            </select></label>
            <label v-if="project.deliveryTargets.length && ['codex','cursor'].includes(selectedAgent?.engine)">交付仓库
              <select v-model="draft.repository"><option value="">仅分析与建议</option>
                <option v-for="ref in project.deliveryTargets" :key="ref.ref" :value="ref.ref">{{ ref.label }}</option>
              </select>
            </label>
            <label>优先级<select v-model="draft.priority"><option value="normal">普通</option><option value="urgent">紧急</option></select></label>
            <details :open="draft.reusedLesson ? true : undefined" class="measure">
              <summary>业务观测</summary>
              <div class="form">
                <p v-if="draft.reusedLesson" class="muted">沿用「{{ draft.reusedLesson.title }}」的指标和上次观测结果。</p>
                <div class="two">
                  <label>指标<input v-model.trim="draft.measure.metric" maxlength="100" placeholder="例如 预约确认率" :readonly="!!draft.reusedLesson"></label>
                  <label>单位<input v-model.trim="draft.measure.unit" maxlength="100" placeholder="例如 %" :readonly="!!draft.reusedLesson"></label>
                  <label>基线<input v-model.number="draft.measure.baseline" type="number" step="any" :readonly="!!draft.reusedLesson"></label>
                  <label>目标（选填）<input v-model.number="draft.measure.target" type="number" step="any"></label>
                </div>
              </div>
            </details>
            <fieldset v-if="materials.length">
              <legend>引用项目资料</legend>
              <label v-for="entry in materials" :key="entry.id" class="check"><input type="checkbox" v-model="draft.material" :value="entry.id" :disabled="draft.reusedLesson?.id===entry.id">{{ entry.title }}<span v-if="entry.visibility==='restricted'" class="muted">需资料所有者授权</span></label>
            </fieldset>
            <fieldset v-if="supportingResources.length">
              <legend>引用外部来源</legend>
              <label v-for="ref in supportingResources" :key="ref.ref" class="check"><input type="checkbox" v-model="draft.resources" :value="ref.ref">{{ ref.label }}<span v-if="ref.revision" class="muted">{{ ref.revision }}</span></label>
            </fieldset>
            <div class="actions"><button class="primary" type="submit" :disabled="busy">交给 Agent</button><button type="button" @click="restoreView()">返回</button></div>
          </form>
        </template>
        <template v-if="view==='ticket' && ticket">
          <div class="backbar"><button class="quiet" @click="restoreView()">← 返回</button><span class="status">{{ stateOf(ticket) }}</span><span>{{ agentName(ticket.work.agent) }}</span><span v-if="ticket.work.source==='feishu'">来自飞书</span>
            <label v-if="project.topics.length && (ticket.work.requester===workspace.actor || project.maintain)" class="ticket-topic">主题
              <select :value="ticket.work.topic || ''" :disabled="busy" @change="setTopic($event.target.value)"><option value="">未归入主题</option><option v-for="topic in topicOptions" :key="topic.id" :value="topic.id">{{ topicLabel(topic) }}</option></select>
            </label><span v-else-if="ticket.topicTitle">{{ ticket.topicTitle }}</span>
          </div>
          <div class="details">
            <div class="stack">
              <section class="panel"><h2>讨论</h2>
                <div v-if="!ticket.channelHistory.some(message=>message.id===ticket.origin)" class="message"><small>{{ ticket.work.requester }}</small><p>{{ ticket.request }}</p></div>
                <div v-for="message in ticket.channelHistory" :key="message.id" class="message">
                  <small>{{ message.member }} · {{ sourceName(message.source) }}<template v-if="message.github?.kind==='inline'"> · 行内评论<span v-if="message.github.commit"> {{ message.github.commit.slice(0,8) }}</span></template> <a v-if="message.url" :href="message.url" target="_blank" rel="noopener noreferrer">来源</a></small>
                  <p>{{ message.text }}</p>
                </div>
                <div v-for="message in ticket.history.filter(message=>message.id!==ticket.origin)" :key="message.id" class="message"><small>{{ message.actor }}</small><p>{{ message.text }}</p></div>
                <div v-for="item in ticket.discussionNotes" :key="item.id" class="message">
                  <small>飞书群整理</small><p><strong>{{ item.title }}</strong> · {{ item.reason }}</p>
                  <a v-for="(source,index) in item.evidence.filter(source=>source.url)" :key="index" :href="source.url" target="_blank" rel="noopener noreferrer" class="source-link">{{ source.title }}</a>
                </div>
                <form v-for="question in ticket.questions" :key="question.id" class="question" @submit.prevent="answer(question.id)">
                  <h3>{{ question.title }}</h3><p>{{ question.text }}</p>
                  <div v-if="question.options.length" class="actions"><button v-for="(option,i) in question.options" type="button" :key="i" :disabled="busy" @click="answer(question.id,i)">{{ option }}</button></div>
                  <label>补充答复<textarea rows="2" v-model="answers[question.id]"></textarea></label>
                  <button type="submit" :disabled="busy || !answers[question.id]?.trim()">提交答复</button>
                </form>
                <p v-if="ticket.report && !ticket.questions.length && !ticket.result && !ticket.work.accepted && !ticket.materialHidden" class="muted">{{ ticket.report.summary }}</p>
              </section>
              <section v-if="ticket.materialHidden" class="panel"><h2>成果</h2>
                <p v-if="ticket.work.accepted">已验收此版本。</p><p class="muted">来源资料授权已变化，成果正文已收回。</p>
              </section>
              <section v-if="ticket.result" class="panel"><h2>成果</h2><p class="prose">{{ ticket.result.text }}</p>
                <dl class="facts"><dt>成果版本</dt><dd><code>{{ ticket.result.revision.slice(0,12) }}</code></dd>
                <dt>引用资料</dt><dd>{{ ticket.result.sources.length }} 份</dd></dl>
                <p v-if="ticket.work.accepted" class="notice">已由 {{ ticket.work.accepted.actor }} 验收此版本。</p>
                <form v-else-if="ticket.work.requester===workspace.actor" class="form" @submit.prevent="accept">
                  <label>可复用结论（选填）<textarea v-model="review.body" rows="3"></textarea></label>
                  <label v-if="review.body.trim()">适用条件<input v-model.trim="review.conditions" required></label>
                  <button class="primary" type="submit" :disabled="busy">验收此版本</button>
                </form>
                <button v-if="ticket.candidate" @click="go('knowledge')">查看知识候选</button>
              </section>
              <section v-if="ticket.work.measure" class="panel">
                <h2>业务观测</h2>
                <dl class="facts">
                  <dt>指标</dt><dd>{{ ticket.work.measure.metric }}（{{ ticket.work.measure.unit }}）</dd>
                  <template v-if="ticket.work.measure.baseline!==undefined"><dt>基线</dt><dd>{{ ticket.work.measure.baseline }}</dd></template>
                  <template v-if="ticket.work.measure.target!==undefined"><dt>目标</dt><dd>{{ ticket.work.measure.target }}</dd></template>
                </dl>
                <article v-for="record in ticket.observations" :key="record.id" class="document">
                  <strong>实测 {{ record.actual }} {{ ticket.work.measure.unit }}</strong>
                  <span v-if="ticket.work.measure.baseline!==undefined" class="status">较基线 {{ changeFrom(record.actual, ticket.work.measure.baseline) }}{{ ticket.work.measure.unit==='%'?' 个百分点':'' }}</span>
                  <p class="prose">{{ record.evidence }}</p>
                  <small>{{ record.actor }} · {{ new Date(record.at).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'}) }}</small>
                  <button v-if="record.candidate" class="quiet" @click="showLesson(record.candidate)">查看经验</button>
                </article>
                <p v-if="!ticket.observations.length && !ticket.materialHidden" class="muted">待记录业务结果。</p>
                <button v-if="ticket.work.accepted && ticket.result && ticket.work.requester===workspace.actor && !observing" @click="startObservation">记录实际结果</button>
                <form v-if="observing && ticket.result" class="form inner" @submit.prevent="recordObservation">
                  <label>实际值（{{ ticket.work.measure.unit }}）<input v-model.number="observation.actual" type="number" step="any" required></label>
                  <label>观测依据<textarea v-model.trim="observation.evidence" rows="3" maxlength="3500" required></textarea></label>
                  <label>可复用经验（选填）<textarea v-model.trim="observation.body" rows="3" maxlength="3500"></textarea></label>
                  <label v-if="observation.body.trim()">适用条件与例外<input v-model.trim="observation.conditions" maxlength="600" required></label>
                  <div class="actions"><button class="primary" :disabled="busy">保存业务结果</button><button type="button" @click="observing=false">收起</button></div>
                </form>
              </section>
            </div>
            <aside class="stack">
              <section v-if="ticket.channelReferences.length || ticket.work.resources?.length" class="panel">
                <h2>关联来源</h2>
                <div v-for="ref in ticket.channelReferences" :key="ref.key" class="row">
                  <a v-if="ref.url" :href="ref.url" target="_blank" rel="noopener noreferrer">{{ ref.label }}</a><span v-else>{{ ref.label }}</span>
                  <span v-for="issue in ticket.githubIssues.filter(issue=>issue.html_url===ref.url)" :key="issue.number" class="status">{{ issue.state==='open' ? 'Issue 开启' : 'Issue 已关闭' }}<template v-if="issue.state==='closed' && issueReasons[issue.state_reason]"> · {{ issueReasons[issue.state_reason] }}</template></span>
                </div>
                <div v-for="ref in ticket.work.resources || []" :key="ref.ref" class="row">
                  <a v-if="ref.url" :href="ref.url" target="_blank" rel="noopener noreferrer">{{ ref.label }}</a><span v-else>{{ ref.label }}</span>
                  <small v-if="ref.revision">{{ ref.revision }}</small>
                </div>
              </section>
              <section v-if="ticket.requests.length" class="panel"><h2>资料授权</h2><article v-for="request in ticket.requests" :key="request.id" class="grant">
                <strong>{{ request.title }}</strong><p class="muted">{{ accessTitles[request.state] || request.state }}</p>
                <button v-if="request.canManage && request.state==='requested'" :disabled="busy" @click="access(request,'granted')">授权此工单（8 小时）</button>
                <button v-if="request.canManage && request.state==='granted'" :disabled="busy" @click="access(request,'revoked')">撤回本工单授权</button>
              </article></section>
              <section v-if="ticket.work.delivery || ticket.mayLinkDelivery || ticket.work.branches?.length" class="panel">
                <h2>GitHub 交付</h2>
                <dl v-if="ticket.work.delivery" class="facts">
                  <dt>PR</dt><dd><a :href="ticket.work.delivery.url" target="_blank" rel="noopener noreferrer">#{{ ticket.work.delivery.pr }}</a></dd>
                  <template v-if="ticket.work.delivery.state"><dt>PR 状态</dt><dd>{{ prStates[ticket.work.delivery.state] }}</dd></template>
                  <template v-if="ticket.work.delivery.creator"><dt>PR 发起人</dt><dd>{{ githubName(ticket.work.delivery.creator) }}</dd></template>
                  <template v-if="ticket.work.delivery.mergedBy"><dt>合并人</dt><dd>{{ githubName(ticket.work.delivery.mergedBy) }}</dd></template>
                  <template v-if="ticket.work.delivery.assignees?.length"><dt>负责人</dt><dd>{{ ticket.work.delivery.assignees.map(githubName).join('、') }}</dd></template>
                  <template v-if="ticket.work.delivery.labels?.length"><dt>标签</dt><dd>{{ ticket.work.delivery.labels.map(label=>label.name).join('、') }}</dd></template>
                  <template v-if="ticket.work.delivery.milestone"><dt>里程碑</dt><dd>{{ ticket.work.delivery.milestone.title }}</dd></template>
                  <dt>提交</dt><dd><code>{{ ticket.work.delivery.headSha.slice(0,12) }}</code></dd>
                  <dt>CI</dt><dd>{{ ciText[ticket.work.delivery.ci] }}</dd>
                </dl>
                <details v-if="ticket.work.delivery?.commits?.length" class="document" open>
                  <summary>提交归因</summary>
                  <dl v-for="commit in ticket.work.delivery.commits" :key="commit.sha" class="facts">
                    <dt>提交</dt><dd><code>{{ commit.sha.slice(0,12) }}</code></dd>
                    <dt>作者／提交者</dt><dd>{{ githubName(commit.author) }} ／ {{ githubName(commit.committer) }}</dd>
                    <dt>推送者</dt><dd>{{ githubName(commit.push?.actor) }}</dd>
                    <template v-if="commit.run">
                      <dt>执行 Agent</dt><dd><button class="link" @click="openTicket(commit.run.ticket)">{{ engineName(commit.run.actor.engine) }} #{{ commit.run.id }}</button></dd>
                      <dt>委托人</dt><dd>{{ commit.run.actor.delegatedBy }}<small v-if="commit.run.evidence==='entire-checkpoint'"> · 会话已核对</small></dd>
                    </template>
                    <template v-else><dt>Agent 运行</dt><dd>未关联已验证委托</dd></template>
                  </dl>
                </details>
                <details v-if="ticket.work.delivery?.reviews?.length" class="document"><summary>审查记录</summary>
                  <div v-for="review in ticket.work.delivery.reviews" :key="review.id" class="row"><a :href="review.html_url" target="_blank" rel="noopener noreferrer">{{ githubName(review.user) }}</a><span>{{ {APPROVED:'已批准', CHANGES_REQUESTED:'要求修改', COMMENTED:'评论', DISMISSED:'已撤销'}[review.state] || review.state }}</span><small v-if="review.commit_id">{{ review.commit_id.slice(0,12) }}</small></div>
                </details>
                <details v-if="ticket.deliveryVersions.length>1" class="document"><summary>交付版本</summary>
                  <details v-for="version in ticket.deliveryVersions" :key="version.url+version.baseSha+version.headSha" class="document">
                    <summary>#{{ version.pr }} · {{ version.headSha.slice(0,8) }} · {{ prStates[version.state] }} · {{ ciText[version.ci] }}</summary>
                    <p><a :href="version.url" target="_blank" rel="noopener noreferrer">查看 GitHub PR</a></p>
                    <dl v-for="commit in version.commits || []" :key="commit.sha" class="facts">
                      <dt>提交</dt><dd><code>{{ commit.sha.slice(0,12) }}</code></dd>
                      <dt>推送者</dt><dd>{{ githubName(commit.push?.actor) }}</dd>
                      <template v-if="commit.run"><dt>委托人</dt><dd>{{ commit.run.actor.delegatedBy }} · {{ engineName(commit.run.actor.engine) }}</dd></template>
                    </dl>
                  </details>
                </details>
                <form v-if="ticket.mayLinkDelivery" class="form" @submit.prevent="linkDelivery">
                  <label>PR 链接<input v-model.trim="deliveryUrl" type="url" placeholder="https://github.com/…" required></label>
                  <button :disabled="busy">{{ ticket.work.delivery ? '更新交付版本' : '关联交付' }}</button>
                </form>
                <details v-if="ticket.work.branches?.length || ticket.mayLinkDelivery" class="document">
                  <summary>关联分支</summary>
                  <div v-for="branch in ticket.work.branches || []" :key="branch.repoId+'|'+branch.name+'|'+branch.sha" class="row source-row">
                    <a :href="branchLink(branch)" target="_blank" rel="noopener noreferrer">{{ branch.name }}</a>
                    <small>{{ branch.sha.slice(0,12) }}</small><small v-if="branch.push?.actor">{{ githubName(branch.push.actor) }}</small>
                  </div>
                  <form v-if="ticket.mayLinkDelivery" class="form" @submit.prevent="linkBranch">
                    <label>GitHub 分支链接<input v-model.trim="branchUrl" type="url" placeholder="https://github.com/…" required></label><button :disabled="busy">关联分支</button>
                  </form>
                </details>
              </section>
              <section class="panel"><h2>执行记录</h2>
                <p v-if="ticket.decision" class="muted">{{ ticket.decision.scope }}</p>
                <p v-if="ticket.timers.length" class="muted">下次复查 {{ new Date(ticket.timers[0].at).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'}) }}</p>
                <div v-for="run in ticket.runs" :key="run.id" class="document">
                  <div class="section-head"><strong>{{ run.resumed ? '接续会话' : '执行' }} #{{ run.id }}</strong><span class="status">{{ runTitles[run.state] || run.state }}</span></div>
                  <dl v-if="run.attribution" class="facts">
                    <dt>委托人</dt><dd>{{ run.attribution.delegatedBy }} · {{ sourceName(run.attribution.requestedVia) === 'web' ? '工作台' : sourceName(run.attribution.requestedVia) }}</dd>
                    <dt>执行 Agent</dt><dd>{{ agentName(run.attribution.agent) }} · {{ engineName(run.attribution.engine) }}</dd>
                    <dt>Agent 所有者</dt><dd>{{ run.attribution.owner }}</dd>
                    <template v-if="run.development?.commit"><dt>本地提交</dt><dd><code>{{ run.development.commit.slice(0,12) }}</code></dd></template>
                  </dl>
                </div>
                <button v-if="ticket.stage.stage!=='ended' && ticket.work.requester===workspace.actor" class="quiet" :disabled="busy" @click="stop">停止工单</button>
                <button v-if="ticket.work.parent" class="quiet" @click="openTicket(ticket.work.parent)">打开上游工单</button>
                <button v-if="project?.mayStart" class="quiet" @click="openComposer('',ticket.id)">从此工单发起协作</button>
              </section>
              <section v-if="ticket.children.length || ticket.related.length || project.maintain || ticket.work.requester===workspace.actor" class="panel"><h2>关联工作</h2>
                <div v-for="child in ticket.children" :key="child.id" class="row"><button class="link" @click="openTicket(child.id)">{{ child.title }}</button><small>子任务 · {{ child.requester }}</small></div>
                <div v-for="item in ticket.related" :key="item.id" class="row"><button class="link" @click="openTicket(item.id)">{{ item.title }}</button><small>相关工单</small></div>
                <details v-if="project.maintain || ticket.work.requester===workspace.actor">
                  <summary>关联已有工单</summary>
                  <form class="form" @submit.prevent="relateWork"><label>选择工单<select v-model="relatedTarget" required>
                    <option value="" disabled>请选择</option>
                    <option v-for="item in workspace.tickets.filter(item=>item.id!==ticket.id && !ticket.related.some(ref=>ref.id===item.id))" :key="item.id" :value="item.id">{{ workspace.projects.find(p=>p.id===item.work.project)?.title }} · {{ item.title }}</option>
                  </select></label><button :disabled="busy || !relatedTarget">关联</button></form>
                </details>
              </section>
            </aside>
          </div>
        </template>
        <template v-if="view==='knowledge' && project">
          <section class="panel">
            <form class="search" @submit.prevent="loadKnowledge"><label class="visually-hidden" for="search">搜索项目知识</label><input id="search" v-model.trim="query" placeholder="搜索项目知识"><button>搜索</button><button v-if="project.mayStart" type="button" @click="adding=!adding">{{ adding?'收起':'添加资料' }}</button></form>
            <form v-if="adding" class="form inner" @submit.prevent="saveKnowledge">
              <label>标题<input v-model.trim="newEntry.title" required></label>
              <div class="two"><label>类型<select v-model="newEntry.kind"><option value="reference">参考资料</option><option value="procedure">操作方法</option><option value="decision">判断结论</option></select></label>
              <label>可见范围<select v-model="newEntry.visibility"><option value="restricted">仅所有者查看，工单可申请授权</option><option value="project">项目成员</option></select></label></div>
              <label>正文<textarea v-model.trim="newEntry.body" rows="4" required></textarea></label>
              <label>适用条件<input v-model.trim="newEntry.conditions"></label>
              <button type="submit" class="primary" :disabled="busy">保存资料</button>
            </form>
            <p v-if="!entries.length" class="muted">没有匹配的知识。</p>
            <details v-for="entry in entries" :key="entry.id" class="document" :id="'knowledge-'+entry.id" :open="focusedEntry===entry.id ? true : undefined">
              <summary>{{ entry.title }} <span class="status">{{ entry.state==='candidate'?'待采用':entry.body?'已入库':'需授权' }}</span></summary>
              <p v-if="entry.body" class="prose">{{ entry.body }}</p><p v-else class="muted">可在发起协作时引用，并由 {{ entry.owner }} 授权。</p>
              <p v-if="entry.conditions">适用条件 · {{ entry.conditions }}</p>
              <div v-if="entry.provenance?.length" class="provenance">
                <strong>来源</strong>
                <div v-for="ref in entry.provenance" :key="ref.title+ref.revision" class="run">
                  <button v-if="ref.ticket" class="link" @click="openTicket(ref.ticket)">{{ ref.title }}</button>
                  <a v-else-if="ref.url" :href="ref.url" target="_blank" rel="noopener noreferrer">{{ ref.title }}</a>
                  <span v-else>{{ ref.title }}</span>
                  <code>{{ ref.revision.slice(0,12) }}</code>
                </div>
              </div>
              <p v-if="entry.learning" class="muted">{{ entry.learning.metric }} · 上次实测 {{ entry.learning.baseline }} {{ entry.learning.unit }}</p>
              <p v-if="entry.learning" class="prose">{{ entry.learning.evidence }}</p>
              <div v-if="entry.canPublish || (entry.learning && project.mayStart)" class="actions">
                <button v-if="entry.canPublish" :disabled="busy" @click="publish(entry)">采用此版本</button>
                <button v-if="entry.learning && project.mayStart" @click="reuse(entry)">用这条经验发起协作</button>
              </div>
            </details>
          </section>
        </template>
      </section>
    </div>
  </main>
</body>
</html>
