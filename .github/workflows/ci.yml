name: Contractor collaboration checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    # SRT requires capability-bearing user namespaces on the CI host.
    runs-on: ubuntu-22.04
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install the external Linux sandbox for tests
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat ripgrep
          cp -R fixtures/sandbox-provider "$RUNNER_TEMP/contractor-sandbox"
          npm ci --ignore-scripts --prefix "$RUNNER_TEMP/contractor-sandbox"
          printf '%s\n' "CONTRACTOR_SANDBOX_ROOT=$RUNNER_TEMP/contractor-sandbox/node_modules/@anthropic-ai/sandbox-runtime" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run check:docs
      - run: npm run audit:upstream
      - name: Verify Linux sandbox startup
        run: node --import tsx --test tests/workbench-linux-sandbox.test.ts
      - run: npm test
      - name: Verify Contractor execution
        env:
          CONTRACTOR_TEST_EXECUTION: contractor
        run: |
          node --import tsx --test tests/workbench-owned-scheduler.test.ts tests/workbench-required-answers.test.ts tests/workbench-remote-runner.test.ts tests/workbench-platform-agent.test.ts tests/workbench-ticket-recovery.test.ts tests/workbench-task-center.test.ts
      - run: npm run typecheck
      - run: npm run build:ui
      - run: npm run audit:upstream -- --browser
      - name: Verify native adapters
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m pip install ./upstream/octop-memory ./upstream/octop-gateway
          python tests/deepseek-readonly.py
          python tests/octop-memory-native.py
          python tests/octop-im-native.py
      - run: npm run package:runner
      - name: Verify runner installation without a bundled sandbox
        run: |
          npm install --ignore-scripts --prefix dist/runner-check ./dist/runner/contractor-runner-*.tgz
          tar -tzf dist/runner/contractor-runner-*.tgz > dist/runner/contents.txt
          if grep -q '^package/node_modules/' dist/runner/contents.txt; then exit 1; fi
          CONTRACTOR_RUNNER_HOME="$RUNNER_TEMP/contractor-runner-check" dist/runner-check/node_modules/.bin/contractor stop http://127.0.0.1:4282
      - name: Package Contractor execution device
        run: |
          npm run package:runner -- dist/runner/contractor --contractor-only
          tar -tzf dist/runner/contractor/contractor-runner-*.tgz > dist/runner/contractor/contents.txt
          if grep -q '^package/upstream/autoloop/' dist/runner/contractor/contents.txt; then
            exit 1
          fi
      - run: npm run package:source -- --committed
